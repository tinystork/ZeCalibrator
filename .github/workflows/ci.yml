name: ci

on:
  push:
  pull_request:

jobs:
  bootstrap:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test tooling
        run: python -m pip install --upgrade pip setuptools wheel build pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Install the built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install PySide6
        run: python -m pip install 'PySide6>=6.6'

      - name: Run Qt native icon-decode witness
        run: python -m pytest tests/test_icons_qt.py -ra

      - name: Run GUI offscreen suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/gui tests/test_gui.py tests/test_icons_qt.py -ra

      - name: Smoke test from unrelated CWD (entry points and package)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          zecalibrator --version
          zecalibrator --help
          python -m zecalibrator --version
          python -c "import zecalibrator, zecalibrator.api.v1; assert zecalibrator.__version__ == '0.0.3'; assert zecalibrator.api.v1.API_VERSION == '1.0'"

      - name: Run the bootstrap test suite (namespace/version/resources/storage/CLI)
        run: python -m pytest -ra
