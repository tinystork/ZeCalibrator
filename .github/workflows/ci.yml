name: ci

on:
  push:
  pull_request:

jobs:
  bootstrap:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test tooling
        run: python -m pip install --upgrade pip setuptools wheel build pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Install the built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Smoke test from unrelated CWD (entry points and package)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          zecalibrator --version
          zecalibrator --help
          python -m zecalibrator --version
          python -c "import zecalibrator, zecalibrator.api.v1; assert zecalibrator.__version__ == '0.1.0'; assert zecalibrator.api.v1.API_VERSION == '1.0'"

      - name: Run the bootstrap test suite (namespace/version/resources/storage/CLI)
        run: python -m pytest -ra
